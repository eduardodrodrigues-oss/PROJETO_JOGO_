<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo de Luta</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="hud">
      <div class="health-bar"><div id="player1Health" class="health-fill"></div></div>
      <div id="timer">60</div>
      <div class="health-bar"><div id="player2Health" class="health-fill"></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Painel de Controles na Tela para o Player 2 -->
    <div class="controls-panel">
      <div class="control-group movement">
        <button id="btnLeft">◄ Esquerda</button>
        <button id="btnJump">▲ Pular</button>
        <button id="btnRight">Direita ►</button>
      </div>
      <div class="control-group actions">
        <button id="btnAttack" class="btn-action">Soco (Z)</button>
        <button id="btnShield" class="btn-action">Escudo (X)</button>
        <button id="btnSpecial" class="btn-action btn-special">Especial (C)</button>
        <button id="btnDefend" class="btn-action btn-defend">Defesa (V)</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
